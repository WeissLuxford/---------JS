  .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: start; }

  .stack { display: flex; flex-direction: column; gap: 14px; }
  .bg-card { --c: #ff8a3d; --rar: #c07cff; }
  .card-art .gx { width: 100%; height: 100%; filter: drop-shadow(0 0 3px var(--c)) drop-shadow(0 0 10px var(--c)) drop-shadow(0 0 22px color-mix(in srgb, var(--c) 55%, transparent)); }
  .card-head h3 { margin: 0; }
  .meta-i .gx { width: 17px; height: 17px; color: #a69a87; }
  .ach-medal .gx { width: 22px; height: 22px; }
  .ach .ach-medal .gx { width: 19px; height: 19px; }
  .ach-grid.one { grid-template-columns: 1fr; }
  .abil { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .ab { border: 1px solid var(--line); border-radius: 10px; background: rgba(0,0,0,.22); padding: 8px 4px; text-align: center; color: var(--gold-2); }
  .ab .ic, .ab .gx { width: 26px; height: 26px; }
  .ab b { display: block; font-size: 22px; color: var(--gold-3); }
  .ab small { color: var(--dim); font-size: 12px; }
  .chips2 { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip2 { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 7px; border-radius: 99px; border: 1px solid rgba(229,83,61,.45); background: rgba(229,83,61,.1); color: #f2b7a8; font-size: 14px; }
  .chip2 .ic, .chip2 .gx { width: 18px; height: 18px; }
  .rowsk { display: flex; flex-direction: column; gap: 2px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; background: rgba(0,0,0,.2); }
  .rowsk div { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--text-2); }
  .rowsk .ic, .rowsk .gx { width: 20px; height: 20px; color: var(--gold-2); }
  .rowsk b { margin-left: auto; color: var(--gold-3); }
  .tabs2 { display: flex; justify-content: space-around; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 8px 4px; }
  .tabs2 span { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--dim); }
  .tabs2 span.on { color: var(--gold-2); }
  .tabs2 .ic, .tabs2 .gx { width: 24px; height: 24px; }
  .sizes { display: flex; align-items: flex-end; gap: 16px; color: var(--gold-3); padding: 8px 4px; }
  .sz { display: flex; align-items: flex-end; gap: 6px; }
  @media (max-width: 860px) {
    .cols { grid-template-columns: 1fr; }
    .tbl { grid-template-columns: 96px 64px 64px 1fr; }
    .cell .ic, .cell .gx { width: 32px; height: 32px; }

      ${[["a1", "Натуральная двадцатка", "Выбросить 20 на d20"], ["a2", "У костра", "Первый короткий отдых"], ["a3", "Гроза нежити", "Победить 10 мертвецов"], ["a4", "На волоске", "Три успеха в спасбросках от смерти"]].map(([k, n, d]) => `<div class="ach on"><span class="ach-medal">${x(k)}</span><span class="ach-t"><b>${n}</b><small>${d}</small></span></div>`).join("")}
    </div>
    <div class="tabs2">
      ${[["t1", "Герой", 1], ["t2", "Бой"], ["t3", "Магия"], ["t4", "Вещи"], ["t5", "Заметки"]].map(([k, n, on]) => `<span class="${on ? "on" : ""}">${x(k)}${n}</span>`).join("")}
    </div>
    <div class="sizes">${[14, 18, 24, 32, 48].map(z => `<span class="sz" style="font-size:${z}px;width:${z}px;height:${z}px">${x("fireball").replace('class="', `style="width:${z}px;height:${z}px" class="`)}</span>`).join("")}</div>
  </div>`;
}

document.getElementById("cols").innerHTML = SETS.map(column).join("");
document.getElementById("table").innerHTML = table();

const urls = [...new Set([...document.querySelectorAll("[data-chk]")].map(e => e.dataset.chk))];
await Promise.all(urls.map(u => fetch(u, { method: "HEAD" }).then(r => { exists[u] = r.ok; }).catch(() => { exists[u] = false; })));
document.querySelectorAll("[data-chk]").forEach(e => { if (!exists[e.dataset.chk]) e.classList.add("miss"); });
</script>
